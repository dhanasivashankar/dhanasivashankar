<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="checker" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#0D0D0D"/>
      <rect width="30" height="30" fill="#1B4332"/>
      <rect x="30" y="30" width="30" height="30" fill="#1B4332"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#000000" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D62828"/>
      <stop offset="100%" stop-color="#FCA311"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#checker)"/>
  <rect width="1200" height="300" fill="url(#fade)"/>

  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>
  <rect x="0" y="294" width="1200" height="6" fill="url(#accent)"/>

  <text x="600" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#FFFFFF" letter-spacing="2">
    Dhana Siva Shankar
  </text>

  <text x="600" y="196" text-anchor="middle" font-family="'Courier New', monospace" font-size="20" fill="#FCA311" letter-spacing="1">
    Java Backend Developer  •  DSA  •  Machine Learning
  </text>
</svg>
